[project]
name = "unbinned-inference-paper"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.30.1",
    "keras>=3.11.3",
    "matplotlib>=3.10.6",
    "scikit-learn>=1.7.1",
    "tensorflow>=2.20.0; sys_platform != 'darwin'",
    "tensorflow>=2.13.0,<2.19.0; sys_platform == 'darwin'",
    "tensorflow-metal>=1.2.0 ; sys_platform == 'darwin'",
    "setuptools>=80.9.0",
    "pyyaml>=6.0.2",
]
